<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <title>MapsLeads</title>
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"
            fill="currentColor"
          />
          <circle cx="12" cy="9" r="2.5" fill="#fff" />
        </svg>
        <div class="brand-text">
          <strong>MapsLeads</strong>
          <span>Leads entreprises SIRENE</span>
        </div>
      </div>
    </header>

    <main class="main">
      <div id="status" class="status status--muted">Prêt à rechercher.</div>

      <details class="filters" open>
        <summary>Recherche &amp; options</summary>

        <label class="field">
          <span>Métier ou activité</span>
          <input id="searchQuery" type="text" placeholder="restaurant, plombier, coiffeur..." autocomplete="off" />
        </label>

        <label class="field">
          <span>Ville, département ou code postal</span>
          <input id="locationInput" type="text" placeholder="Tours, 37 ou 37000..." autocomplete="off" />
        </label>

        <label class="field">
          <span>Nombre à extraire</span>
          <input id="limitInput" type="number" min="1" max="200" value="20" />
        </label>

        <label class="field">
          <span>Trier par</span>
          <select id="sortBy">
            <option value="score">Opportunité</option>
            <option value="creation">Plus récents</option>
            <option value="name">Alphabétique</option>
          </select>
        </label>
      </details>

      <button id="extractBtn" class="btn btn--primary">
        Rechercher des leads
      </button>

      <div id="results" class="results hidden">
        <div class="results-head">
          <span id="resultCount">0 lead trouvé</span>
        </div>
        <ul id="preview" class="preview"></ul>
      </div>

      <button id="exportBtn" class="btn btn--accent hidden">
        Exporter en Excel
      </button>

      <button id="sessionBtn" class="btn btn--session">
        Ouvrir la session d'appels
      </button>

      <div id="paywall" class="paywall hidden">
        <strong>Quota gratuit atteint</strong>
        <p>Passez en Premium : exports illimités, session d'appels complète.</p>
        <button id="trialBtn" class="btn btn--trial">
          Essai gratuit 2 jours — 15 €/mois ensuite
        </button>
        <div class="or-divider"><span>J'ai déjà une clé de licence</span></div>
        <div class="license-row">
          <input
            id="licenseInput"
            type="text"
            class="license-input"
            placeholder="XXXX-XXXX-XXXX-XXXX"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="activateBtn" class="btn btn--sm">Activer</button>
        </div>
        <div id="licenseStatus" class="license-status hidden"></div>
      </div>
    </main>

    <footer class="footer">
      <div id="quota" class="quota">
        <div class="quota-bar"><span id="quotaFill" class="quota-fill"></span></div>
        <span id="quotaText" class="quota-text">-</span>
      </div>
      <div class="privacy">Source : base SIRENE (INSEE) — données officielles.</div>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
